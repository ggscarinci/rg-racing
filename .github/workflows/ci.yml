name: Verificar RG Racing
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - run: docker build -t rg-racing:ci .
      - run: RG_TEST_IMAGE=rg-racing:ci bash tests/container.sh
